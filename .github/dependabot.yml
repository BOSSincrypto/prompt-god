version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'build'
      prefix-development: 'chore'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      tooling:
        patterns: ['eslint*', 'typescript*', 'prettier', 'vitest', '@vitest/*', '@playwright/*']
      build:
        patterns: ['vite', '@vitejs/*', 'vite-plugin-pwa', 'tailwindcss', '@tailwindcss/*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: 'ci'
