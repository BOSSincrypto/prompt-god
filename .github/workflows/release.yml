name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    name: Prepare release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

  attach-artifacts:
    name: Attach build artifacts
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build:only

      - name: Package offline bundle
        # A built copy of the PWA so it can be hosted without a toolchain.
        #
        # This is a ROOT build: `base` is `/`, and the manifest's scope,
        # start_url and the service-worker registration are all rooted there
        # too. Served from a subdirectory every asset 404s and the app never
        # leaves its boot placeholder, so the constraint ships inside the
        # archive rather than being something a user discovers.
        run: |
          cp dist/index.html dist/404.html
          cat > dist/SERVING.md <<'DOC'
          # Serving this build

          This archive is a root build. Extract it and serve the extracted
          directory as the web root:

              python3 -m http.server 8080     # then open http://localhost:8080

          It will NOT work served from a subdirectory (`https://host/prompt-god/`)
          — `base`, the manifest `scope` and `start_url`, and the service-worker
          registration are all rooted at `/`. To host under a subpath, rebuild
          from source with that path:

              BASE_PATH=/prompt-god/ npm run build:only

          For a single-page app, point unknown paths at `404.html` (a copy of
          `index.html`) so deep links resolve.
          DOC
          tar -czf "prompt-god-${{ needs.release-please.outputs.tag }}.tar.gz" -C dist .
          (cd dist && zip -qr "../prompt-god-${{ needs.release-please.outputs.tag }}.zip" .)

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag }}
          files: |
            prompt-god-${{ needs.release-please.outputs.tag }}.tar.gz
            prompt-god-${{ needs.release-please.outputs.tag }}.zip
